</helmet>
<div style="display:flex;width:880px;height:560px;font-family:'Open Sans',sans-serif;color:#1F1F1F;background:#FFFFFF">
<div style="width:200px;background:#2B2B2B;padding:24px 16px;box-sizing:border-box"><div style="font-family:'Open Sans',sans-serif;font-weight:700;font-size:16px;color:#F26A21;margin-bottom:20px">Admin panel</div>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button sc-camel-on-click="{{t.pick}}" style="display:block;width:100%;text-align:left;min-height:44px;padding:0 14px;margin-bottom:4px;border:0;border-radius:4px;background:{{t.bg}};color:{{t.fg}};font:600 14px 'Open Sans',sans-serif">{{t.label}}</button></sc-for></div>
<div style="flex:1;padding:28px;overflow-y:auto"><div style="font-family:'Open Sans',sans-serif;font-weight:700;font-size:24px">{{title}}</div><div style="font-size:14px;color:#5F5F5F;margin-top:4px">{{sub}}</div>
<div style="margin-top:18px;background:#fff;border:1px solid #E2E2E2;border-radius:4px"><div style="display:flex;padding:12px 16px;font-size:12px;font-weight:600;color:#5F5F5F"><div style="flex:2">NAME</div><div style="flex:2">DETAILS</div><div style="flex:1">STATUS</div><div style="width:190px">ACTION</div></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid #E2E2E2;font-size:14px"><div style="flex:2;font-weight:600">{{r.a}}</div><div style="flex:2;color:#5F5F5F">{{r.b}}</div><div style="flex:1"><span style="background:{{r.bg}};border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600">{{r.status}}</span></div><div style="display:flex;gap:8px;width:190px"><sc-for list="{{r.acts}}" as="x" hint-placeholder-count="2"><button sc-camel-on-click="{{x.fn}}" style="min-height:44px;padding:0 12px;border-radius:4px;border:1px solid {{x.bd}};background:{{x.bg}};color:{{x.fg}};font:600 13px 'Open Sans',sans-serif">{{x.label}}</button></sc-for></div></div></sc-for></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:560}}">
class Component extends DCLogic {
renderVals() {
const s=Object.assign({tab:'ap',st:{}},this.state||{});
const D={
ap:{n:'Vendor approvals',t:'Vendor approvals',sub:'Review new vendor shops before they go live.',init:'Pending',rows:[['Conti Books Corner','a.mensah@st.knust.edu.gh'],['Katanga Tech Hub','k.owusu@st.knust.edu.gh'],['Queens Thrift','e.boateng@st.knust.edu.gh']],acts:[['Approve','Approved',1],['Reject','Rejected',0]]},
li:{n:'Reported listings',t:'Reported listings',sub:'Remove listings that break the rules.',init:'Reported',rows:[['Laptop charger, original','Reason: Item not as described'],['Used mini fridge','Reason: Price misleading']],acts:[['Remove listing','Removed',2],['Keep','Kept',0]]},
rp:{n:'Reports and blocks',t:'Reports and blocks',sub:'Handle reports made by students.',init:'Open',rows:[['Katanga Tech Hub','No-show at meetup'],['Queens Thrift','Rude messages']],acts:[['Block user','Blocked',2],['Dismiss','Dismissed',0]]},
us:{n:'Users',t:'Users',sub:'All verified student accounts.',init:'Active',rows:[['Kofi Mensah','k.mensah@st.knust.edu.gh'],['Ama Owusu','a.owusu@st.knust.edu.gh'],['Yaw Boateng','y.boateng@st.knust.edu.gh']],acts:[['Block','Blocked',2],['Unblock','Active',0]]}};
const d=D[s.tab],cur=s.st[s.tab]||{};
const good=['Approved','Removed','Active','Kept','Dismissed'],bad=['Rejected','Blocked'];
const sty=k=>k===1?{bg:'#2B2B2B',fg:'#fff',bd:'#2B2B2B'}:k===2?{bg:'#fff',fg:'#9B1C1C',bd:'#9B1C1C'}:{bg:'#fff',fg:'#1F1F1F',bd:'#E2E2E2'};
const rows=d.rows.map((r,i)=>{const status=cur[i]||d.init;return {a:r[0],b:r[1],status,bg:good.includes(status)?'#E2E2E2':bad.includes(status)?'#F6D9D9':'#FDE3D3',acts:d.acts.map(a=>Object.assign({label:a[0],fn:()=>this.setState({st:Object.assign({},s.st,{[s.tab]:Object.assign({},cur,{[i]:a[1]})})})},sty(a[2])))};});
return {title:d.t,sub:d.sub,rows,tabs:Object.keys(D).map(k=>({label:D[k].n,bg:s.tab===k?'rgba(255,255,255,.14)':'transparent',fg:s.tab===k?'#fff':'#D9D9D9',pick:()=>this.setState({tab:k})}))};
}
}
</script>
